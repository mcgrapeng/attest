# SkillSpector 的 HIGH/CRITICAL allowlist —— 逐条人工复核过、明确接受的规则。
#
# 为什么是**规则级**而不是逐条 finding：
#   逐条基线（scanner 的 baseline 子命令）用**位置指纹**匹配 ⇒ 改了代码里那一行，
#   基线就失效、CI 变红。对开源项目这是持续的假红：贡献者每次改代码都要先
#   "重新生成基线"，久而久之就没人看红灯了。
#   规则级 allowlist 不依赖位置 ⇒ 改代码不会让闸门误红；而**新规则**仍然会被拦。
#
# 代价（说清楚，不藏着）：同一个规则在一个已放行的文件里**再出现**不会被拦。
# 规则本身太粗 —— E2 匹配所有环境变量枚举。真正的收口在代码里
# （scripts/readiness.py 的 child_env、scripts/selfcheck.py 的 _child_env
# 都只透传白名单），不靠这个闸门。
#
# **抑制项在 CI 日志里照常打印**，不藏。
#
# 加新条目之前先问：这是真风险还是规则的误报？
# 是真风险 ⇒ 改代码，别加条目。
version: 1

rules:
  # E2「Env Variable Harvesting」：扫描器看到 {**os.environ, ...} 就报。
  # 这里是**必要且已收口**的：子进程要拿到 PATH/HOME 才能跑目标仓库的测试命令；
  # 真正传给目标脚本的环境是白名单（readiness.py 的 child_env、
  # selfcheck.py 的 _child_env 都只透传白名单键）。
  # 复核记录：docs/oss-release-review.md 第六节。
  #
  # 真正的把关不是这条 allowlist，而是 CI 里那条精确检查
  # 「生产代码不得整份继承 os.environ」—— 它不依赖位置，改代码不会误红。
  - id: E2
    reason: >-
      子进程只透传白名单环境变量（child_env / _child_env）—— 逐处复核过，
      见 docs/oss-release-review.md 第六节。扫描器按 {**os.environ} 模式匹配，
      看不到白名单那一层。真正的收口是 CI 里那条「生产代码不得整份继承
      os.environ」的精确检查。

  # AE1「Artifact Evidence」：扫描器说「被引用的文件没被完整分析」。
  # 2026-11-18 实测两种失败模式都指向同一根因：**skillspector 的 LLM 批次没跑完**
  #   ① 无 key：reason code = llm_batch_failed；
  #   ② 有 key 但端点慢：LLM batch failed ... (OpenAITimeoutError)，每个失败批次一条 AE1。
  # ⇒ AE1 是扫描器侧的伴随现象，不是 skill 缺产物、也不是引用结构有问题。
  # （曾经有一轮 AE1 消失，但那轮 skillspector 自己崩了（exit 1 / invalid JSON），
  #   属假信号，别拿它当证据。）
  - id: AE1
    reason: >-
      扫描器没能完整分析被引用的文件（实测根因：skillspector 的 LLM 批次失败 ——
      无 key 时 llm_batch_failed，端点慢时 OpenAITimeoutError）。不是缺失的产物，
      也不是引用结构有问题。误报。

  # PE3「Credential Access」：源码里**点名** .npmrc（说明不复制它），
  # 扫描器按"出现了凭据文件路径"判。凭据本身没有读、没有复制。
  - id: PE3
    reason: >-
      注释里点名 .npmrc，是为了说明**不**复制它（凭据不该进临时副本）；
      复制清单里已经去掉了它。误报。

  # SC9「Concealed Executable Artifact」：.github/ 下随仓库发布的维护脚本
  # （shell），扫描器把它们当成"藏起来的可执行产物"。它们是仓库的一部分，
  # 在 CI 里被显式调用。
  - id: SC9
    reason: >-
      .github/ 下的维护脚本（shell）随仓库发布、在 CI 里被显式调用 ——
      是仓库的一部分，不是藏起来的可执行产物。误报。

  # AST9「反射调用」：getattr(args, 'exec') 这类被当成执行 sink。
  # 实际只是读 argparse 的属性。已改写为直接属性访问，规则仍可能命中别的写法。
  - id: AST9
    reason: >-
      反射调用误报（读 argparse 属性不是执行 sink）。已改写为直接属性访问，
      规则本身仍可能命中别的写法。

  # LP3「Missing Permission Declaration」：skill 没声明 permissions/allowed-tools
  # 但代码有能力检测（env, file_read, file_write, network, shell）。
  # 不声明是**刻意**决定，不是遗漏：
  #   1. allowed-tools 是预授权（Claude Code 里免确认放行），不是权限上限；
  #      skillspector 自己的 remediation 原文就写着 "add a tool only when it is
  #      independently approved as necessary, not to silence this finding"。
  #   2. attest 要跑目标仓库自己的任意测试命令（subprocess → shell/env/network），
  #      工具范围就是宿主 agent 本身的范围，预先放权与最小权限相反。
  #   3. 声明还会触发能力覆盖核查：subprocess 的 shell/env/network 盖不住
  #      （除非预授权整个 Bash），只会换来更多 finding。
  - id: LP3
    reason: >-
      attest 需要执行目标仓库自己的测试命令（subprocess → shell/env/network），
      预授权这些工具与最小权限相反；按扫描器自己的建议，不为消此条而声明
      allowed-tools。

  # TP4「MCP Tool Poisoning」：把 SKILL.md 的**整体声明**拿去比对**单个叶子模块**，
  # 于是说「声明的用途与实际行为不符」。2026-11-21 实测三条的证据分别是：
  #   · scripts/code_strip.py —— 「把字符串与注释换成空格的源码处理工具」
  #     （它是判据推导要用的公共叶子模块，见 test_shared_helpers.py）
  #   · scripts/module_names.py —— 「识别 Python 包目录、产出候选名 token 的小工具」
  #   · scripts/check_env_inheritance.py —— 「检查生产代码是否整份继承 os.environ 的审计脚本」
  # 三者都是 attest 自己的零件，SKILL.md 的声明说的是**整个工具**，拿它跟零件比
  # 必然「不符」。这条规则要抓的是「声明撒谎」（例如一个自称写作的 skill 却在偷数据），
  # 这里不成立：声明与工具行为一致。
  - id: TP4
    reason: >-
      误报：规则拿 SKILL.md 对**整个工具**的声明去比对单个叶子模块
      （code_strip.py / module_names.py / check_env_inheritance.py），
      于是判「声明的用途与实际行为不符」。这三者都是 attest 自己的零件，
      声明与工具行为一致。

  # SC8「Skill ships Python bytecode」：扫的是**工作树**，扫到的是两种都不是发布缺陷的东西：
  #   ① 扫描器**自己造的**字节码 —— 它分析 skill 的 Python 模块时用宿主 python import
  #      了它们，import 就把 .pyc 写进了被扫目录，于是它随后报的是自己的脚印
  #      （实测：扫前 0 个 .pyc，扫后出现 cpython-315 的 .pyc）；
  #   ② 本地跑回归脚本留下的 __pycache__（工作树卫生，不是分发问题）。
  # **发布物里不可能有字节码**：package.py 显式排除 __pycache__/*.pyc，且发现即中止打包；
  # CI 的「分发卫生」job 也独立地拦仓库里的字节码。所以这条放行不会削弱真正的防线。
  - id: SC8
    reason: >-
      误报（工作树）：扫到的是扫描器自己 import 时写下的字节码，或本地跑回归脚本留下的
      __pycache__。发布物里不可能有字节码 —— package.py 排除并在发现时中止打包，
      CI 的分发卫生 job 也独立拦这条；仓库自己的闸扫的是排除字节码的干净副本。

