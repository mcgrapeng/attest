name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # ------------------------------------------------------------------
  # 分发卫生：字节码不能进仓库。
  # 打包进去等于给用户塞 .pyc，还泄漏作者环境（macOS + Python 3.15）。
  # 这一条必须在**独立 job** 里跑 —— 跑测试会现场生成 __pycache__。
  # ------------------------------------------------------------------
  hygiene:
    name: 分发卫生（无字节码）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: 仓库里不得有 __pycache__ / *.pyc
        run: |
          found="$(find . -path ./.git -prune -o \( -name '__pycache__' -o -name '*.pyc' \) -print)"
          if [ -n "$found" ]; then
            echo "::error::仓库里出现了字节码："
            echo "$found"
            exit 1
          fi
          echo "干净：没有 __pycache__ / *.pyc"

  # ------------------------------------------------------------------
  # 回归套件 + 黄金 fixture。
  # 测试脚本的文件名有跳号（r2..r14，中间没有 r5），所以用 glob 逐个跑，
  # 不假设文件名有序或连续。
  # ------------------------------------------------------------------
  test:
    name: 回归套件 + 黄金 fixture（node ${{ matrix.node }} / python ${{ matrix.python }}）
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - node: '22'
            python: '3.11'
          - node: '22'
            python: '3.13'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '${{ matrix.node }}'
      - uses: actions/setup-python@v5
        with:
          python-version: '${{ matrix.python }}'
      - name: 装测试依赖
        run: python -m pip install --disable-pip-version-check pytest pytest-cov
      - name: 跑全部回归脚本（任一失败即失败）
        run: |
          for t in scripts/test_*.py; do
            echo "--- $t"
            python3 "$t" || { echo "::error::FAIL $t"; exit 1; }
          done
      - name: 跑黄金 fixture（5 个期望判定）
        run: bash fixtures/run_fixtures.sh
      - name: 跑 evals（6 条「用户这么说 ⇒ 工具这样回」）
        run: python3 evals/run_evals.py

  # ------------------------------------------------------------------
  # 打包冒烟：把 skill 装进临时目录，跑通四条命令里最关键的三条。
  # ------------------------------------------------------------------
  package-smoke:
    name: 打包冒烟（装进临时目录跑一遍）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: new | check | readiness --json
        run: |
          set -euo pipefail
          TMP="$(mktemp -d)"
          cp -R scripts "$TMP/"
          cp SKILL.md README.md "$TMP/"
          REPO="$(mktemp -d)"
          cp -R fixtures/ts-colocated/. "$REPO/"

          echo "--- req_plan.py new"
          python3 "$TMP/scripts/req_plan.py" new smoke-feature --repo "$REPO" \
            --module src --out "$REPO/docs/smoke-test-plan.md"
          test -f "$REPO/docs/smoke-test-plan.md"

          echo "--- req_plan.py check（刚生成的空计划应当报红）"
          if python3 "$TMP/scripts/req_plan.py" check "$REPO/docs/smoke-test-plan.md" --repo "$REPO"; then
            echo "::error::刚生成的空计划 check 不该通过"
            exit 1
          fi

          echo "--- readiness.py --json"
          python3 "$TMP/scripts/readiness.py" src --repo "$REPO" --json > "$TMP/report.json"
          python3 -c "import json; d=json.load(open('$TMP/report.json')); assert d.get('checks'), 'JSON 里没有 checks'; print('readiness --json OK，', len(d['checks']), '条判据')"

  # ------------------------------------------------------------------
  # SkillSpector 扫描：allowlist 之外不得有 HIGH / CRITICAL。
  #
  # allowlist（.github/skillspector-allowlist.yaml）里是**逐条人工复核过、
  # 明确接受**的规则，每条带理由：
  #   · E2「Env Variable Harvesting」—— 子进程只透传白名单环境变量，
  #     评审逐处核对过（docs/oss-release-review.md 第六节）。
  #   · AE1 / PE3 / SC9 / AST9 —— 误报，逐条写了理由。
  #
  # 为什么是**规则级**而不是逐条 finding 基线：逐条基线按**位置指纹**匹配，
  # 改一行代码就失效 ⇒ 对开源贡献者是持续的假红（每次改代码都要先"重新生成
  # 基线"，久而久之就没人看红灯了）。规则级不依赖位置：改代码不会误红，
  # **新规则**仍然会被拦。代价（同一个已放行规则再出现不会被拦）写在
  # allowlist 文件头，不藏着。
  #
  # 抑制项在日志里照常打印，不藏。确有新风险 ⇒ 改代码，别加条目。
  # ------------------------------------------------------------------
  skillspector:
    name: SkillSpector 扫描（无未放行的 HIGH finding）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: 装 SkillSpector
        # PyPI 上取不到时不阻塞发布（下面的扫描步骤会自己跳过并告警）。
        continue-on-error: true
        run: python -m pip install --disable-pip-version-check skillspector
      - name: 生产代码不得整份继承 os.environ
        # SkillSpector 的 E2（Env Variable Harvesting）是**规则级**放行的 ——
        # 规则太粗，会把所有 {**os.environ} 都算进来。真正的收口在代码里，
        # 所以这里用一条精确的检查替它把关：生产脚本不得整份继承环境变量，
        # 子进程环境必须走白名单（readiness.py 的 child_env /
        # selfcheck.py 的 _child_env）。这条不依赖位置 ⇒ 改代码不会误红。
        run: python3 scripts/check_env_inheritance.py
      - name: 扫描（allowlist 之外不得有 HIGH / CRITICAL）
        run: |
          if ! command -v skillspector >/dev/null 2>&1; then
            echo "::warning::SkillSpector 装不上（PyPI 取不到）—— 跳过扫描。本地补：pip install skillspector"
            exit 0
          fi
          skillspector scan . --no-llm --format json --output scan.json || true
          python3 - <<'PY'
          import json
          import re
          import sys

          # allowlist 是 YAML，但只用正则解析 `  - id: XXX` 就够 ——
          # 不想在 CI 里多一个 PyYAML 依赖。
          allow_text = open(".github/skillspector-allowlist.yaml",
                            encoding="utf-8").read()
          allowed = set(re.findall(r"^\s*-\s+id:\s*(\w+)", allow_text, re.M))
          reasons = dict(re.findall(r"^\s*-\s+id:\s*(\w+)\s*\n\s*reason:\s*>-\s*\n((?:\s{6,}.*\n?)+)",
                                  allow_text, re.M))

          report = json.load(open("scan.json", encoding="utf-8"))
          issues = report.get("issues") or []
          high = [i for i in issues
                  if i.get("severity") in ("HIGH", "CRITICAL")]
          bad = [i for i in high if i.get("id") not in allowed]
          for i in high:
              loc = i.get("location") or {}
              tag = "已放行" if i.get("id") in allowed else "未放行"
              print(f"{tag} {i.get('id')} {i.get('severity')} "
                    f"{loc.get('file')}:{loc.get('start_line')} "
                    f"{i.get('finding')}")
          for rid in sorted(allowed):
              why = " ".join(reasons.get(rid, "").split())
              print(f"allowlist {rid}：{why[:160]}")
          if bad:
              for i in bad:
                  loc = i.get("location") or {}
                  print(f"::error::{i.get('id')} {i.get('severity')} "
                        f"{loc.get('file')}:{loc.get('start_line')} {i.get('finding')}")
              print("::error::allowlist 之外还有 HIGH/CRITICAL。")
              print("::error::若确有新风险 —— 别加 allowlist 条目，改代码。")
              sys.exit(1)
          print(f"OK：HIGH/CRITICAL {len(high)} 条全部落在 allowlist 内；"
                f"另有 {len(issues) - len(high)} 条 MEDIUM/LOW 照常报出")
          PY
