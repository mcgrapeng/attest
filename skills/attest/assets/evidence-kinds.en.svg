<svg xmlns="http://www.w3.org/2000/svg" width="794" height="186" viewBox="0 0 794 186" role="img" aria-label="attest reports four kinds of evidence">
<defs>
<linearGradient id="att-kgrad" x1="0" y1="0" x2="1" y2="0">
<stop offset="0" stop-color="#39c5cf" stop-opacity="0"/>
<stop offset=".5" stop-color="#39c5cf" stop-opacity=".22"/>
<stop offset="1" stop-color="#39c5cf" stop-opacity="0"/>
</linearGradient>
</defs>
<style>
    text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto,
            "Noto Sans SC", "PingFang SC", "Microsoft YaHei", sans-serif; }
    .att-card-bg { fill: #0f1419; stroke: #30363d; }
    @keyframes att-kcard {
      0%, 100% { opacity: .55; }
      50%      { opacity: 1; }
    }
    @keyframes att-kband {
      0%   { transform: translateX(-260px); opacity: 0; }
      10%  { opacity: .9; }
      90%  { opacity: .9; }
      100% { transform: translateX(794px); opacity: 0; }
    }
    @media (prefers-reduced-motion: no-preference) {
      .att-card { animation: att-kcard 7s ease-in-out infinite;
                   animation-delay: calc(var(--i) * .55s); }
      .att-kband { animation: att-kband 7s cubic-bezier(.45,0,.25,1) infinite; }
    }
    </style>
<rect width="794" height="186" rx="14" fill="#0d1117"/>
<g class="att-card" style="--i:0">
  <rect x="12" y="30" width="182" height="140" rx="12" class="att-card-bg"/>
  <rect x="12" y="30" width="3.5" height="140" rx="2" fill="#3fb950"/>
  <path d="M27 56 l5 5 l9 -11" fill="none" stroke="#3fb950" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="56" y="61" font-size="16" font-weight="650" fill="#e6edf3">Measured</text>
  <text x="56" y="78" font-size="10.5" fill="#3fb950" letter-spacing=".4">RUN</text>
  <text x="32" y="108" font-size="11" fill="#8b949e">
    <tspan x="32" dy="0">Something ran: the</tspan>
    <tspan x="32" dy="15">command, its exit</tspan>
    <tspan x="32" dy="15">code and its output</tspan>
    <tspan x="32" dy="15">are in the report</tspan>
  </text>
</g>
<g class="att-card" style="--i:1">
  <rect x="208" y="30" width="182" height="140" rx="12" class="att-card-bg"/>
  <rect x="208" y="30" width="3.5" height="140" rx="2" fill="#39c5cf"/>
  <circle cx="230" cy="56" r="9" fill="none" stroke="#39c5cf" stroke-width="2"/><circle cx="230" cy="56" r="3" fill="#39c5cf"/>
  <text x="252" y="61" font-size="16" font-weight="650" fill="#e6edf3">Static signal</text>
  <text x="252" y="78" font-size="10.5" fill="#39c5cf" letter-spacing=".4">READ</text>
  <text x="228" y="108" font-size="11" fill="#8b949e">
    <tspan x="228" dy="0">Read from the source,</tspan>
    <tspan x="228" dy="15">not run. Never supports</tspan>
    <tspan x="228" dy="15">a pass on its own</tspan>
  </text>
</g>
<g class="att-card" style="--i:2">
  <rect x="404" y="30" width="182" height="140" rx="12" class="att-card-bg"/>
  <rect x="404" y="30" width="3.5" height="140" rx="2" fill="#d29922"/>
  <path d="M417 56 h18" stroke="#d29922" stroke-width="2.4" stroke-linecap="round"/><path d="M420 63 h12" stroke="#d29922" stroke-width="1.6" stroke-linecap="round" opacity=".55"/>
  <text x="448" y="61" font-size="16" font-weight="650" fill="#e6edf3">Not measured</text>
  <text x="448" y="78" font-size="10.5" fill="#d29922" letter-spacing=".4">BLOCKED</text>
  <text x="424" y="108" font-size="11" fill="#8b949e">
    <tspan x="424" dy="0">Could not be measured;</tspan>
    <tspan x="424" dy="15">the report names the</tspan>
    <tspan x="424" dy="15">missing precondition</tspan>
  </text>
</g>
<g class="att-card" style="--i:3">
  <rect x="600" y="30" width="182" height="140" rx="12" class="att-card-bg"/>
  <rect x="600" y="30" width="3.5" height="140" rx="2" fill="#6e7681"/>
  <circle cx="622" cy="56" r="9" fill="none" stroke="#6e7681" stroke-width="2" stroke-dasharray="3.4 3"/><path d="M616 62 L628 50" stroke="#6e7681" stroke-width="2" stroke-linecap="round"/>
  <text x="644" y="61" font-size="16" font-weight="650" fill="#e6edf3">Not judged</text>
  <text x="644" y="78" font-size="10.5" fill="#6e7681" letter-spacing=".4">OUT OF SCOPE</text>
  <text x="620" y="108" font-size="11" fill="#8b949e">
    <tspan x="620" dy="0">Out of scope by</tspan>
    <tspan x="620" dy="15">design: requirements,</tspan>
    <tspan x="620" dy="15">product behaviour,</tspan>
    <tspan x="620" dy="15">performance, security</tspan>
  </text>
</g>
<rect x="0" y="22" width="120" height="156" rx="10" fill="url(#att-kgrad)" class="att-kband"/>
</svg>
