<svg xmlns="http://www.w3.org/2000/svg" width="574" height="1208" viewBox="0 0 574 1208" role="img" aria-label="attest report">
<defs>
<linearGradient id="att-band" x1="0" y1="0" x2="0" y2="1">
<stop offset="0" stop-color="#39c5cf" stop-opacity="0"/>
<stop offset=".5" stop-color="#39c5cf" stop-opacity=".16"/>
<stop offset="1" stop-color="#39c5cf" stop-opacity="0"/>
</linearGradient>
<filter id="att-shadow" x="-10%" y="-10%" width="120%" height="130%">
<feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000" flood-opacity=".45"/>
</filter>
</defs>
<style>
    .att-mono { font-family: ui-monospace,SFMono-Regular,Menlo,Consolas,monospace; }
    @keyframes att-scan {
      0%   { transform: translateY(48px); opacity: 0; }
      8%   { opacity: .5; }
      92%  { opacity: .5; }
      100% { transform: translateY(1190px); opacity: 0; }
    }
    @keyframes att-cursor {
      0%, 49%   { opacity: 1; }
      50%, 100% { opacity: 0; }
    }
    @keyframes att-breathe {
      0%, 100% { opacity: .35; }
      50%      { opacity: .85; }
    }
    @keyframes att-reveal {
      from { opacity: 0; }
      to   { opacity: 1; }
    }
    @media (prefers-reduced-motion: no-preference) {
      .att-line {
        animation: att-reveal .5s ease-out both;
        animation-delay: calc(var(--d) * 45ms + .4s);
      }
      .att-scan {
        animation: att-scan 9s cubic-bezier(.4,0,.2,1) infinite;
        animation-delay: 2.6s;
      }
      .att-cursor {
        animation: att-cursor 1.05s steps(1) infinite;
      }
      .att-verdict-box {
        animation: att-breathe 5s ease-in-out infinite;
      }
    }
    </style>
<g filter="url(#att-shadow)">
<rect width="574" height="1208" rx="12" fill="#0d1117" stroke="#30363d"/>
</g>
<line x1="0" y1="30" x2="574" y2="30" stroke="#30363d" opacity=".7"/>
<circle cx="18" cy="16" r="4" fill="#f85149" opacity=".55"/><circle cx="33" cy="16" r="4" fill="#d29922" opacity=".55"/><circle cx="48" cy="16" r="4" fill="#3fb950" opacity=".55"/>
<text x="76" y="20" class="att-mono" font-size="11" fill="#8b949e">attest · readiness.py · fixtures/ts-colocated</text>
<rect x="12" y="1110" width="549.6" height="20" rx="6" class="att-verdict-box"/>
<g class="att-mono" font-size="14" fill="#c9d1d9">
<text x="18" y="64" class="att-line" style="--d:0"><tspan fill="#39c5cf">将执行的仓库脚本：测试车道（逐个测试文件跑 $ node --test &amp;lt;测试文</tspan></text>
<text x="18" y="84" class="att-line" style="--d:1">件&amp;gt;）</text>
<text x="18" y="104" class="att-line" style="--d:2"></text>
<text x="18" y="124" class="att-line" style="--d:3">交付就绪度分析 — src</text>
<text x="18" y="144" class="att-line" style="--d:4">仓库：/Users/zhangpeng/workspace/orca/attest/ai-assign/fixtures/</text>
<text x="18" y="164" class="att-line" style="--d:5">ts-colocated</text>
<text x="18" y="184" class="att-line" style="--d:6">源码 1 文件（+0 个测试支撑） / 单测 1 个 / itest 0 个</text>
<text x="18" y="204" class="att-line" style="--d:7"></text>
<text x="18" y="224" class="att-line" style="--d:8"><tspan fill="#39c5cf">── 已实测 ───────────────────────────────────────────</tspan></text>
<text x="18" y="244" class="att-line" style="--d:9"><tspan fill="#3fb950">  ✓ 测试全绿 — 没有失败用例</tspan></text>
<text x="18" y="264" class="att-line" style="--d:10"><tspan fill="#d29922">  — 核心逻辑测试到位 — 仓库没有覆盖率闸门，缺少判据（实测平均行</tspan></text>
<text x="18" y="284" class="att-line" style="--d:11">覆盖 100% / 分支 100%）；通用阈值默认不阻塞 （用项目自己的 test </text>
<text x="18" y="304" class="att-line" style="--d:12">命令） </text>
<text x="18" y="324" class="att-line" style="--d:13"><tspan fill="#8b949e">      · calc.ts: 行100% 分支100% 函数100%</tspan></text>
<text x="18" y="344" class="att-line" style="--d:14"></text>
<text x="18" y="364" class="att-line" style="--d:15"><tspan fill="#39c5cf">── 静态信号（不能单独支撑「通过」） ────────────────────────────</tspan></text>
<text x="18" y="384" class="att-line" style="--d:16"><tspan fill="#39c5cf">──</tspan></text>
<text x="18" y="404" class="att-line" style="--d:17"><tspan fill="#3fb950">  ✓ 测试卫生（不留残留、不靠 sleep） — 没有固定等待，也没发现不</tspan></text>
<text x="18" y="424" class="att-line" style="--d:18">清理的写库测试</text>
<text x="18" y="444" class="att-line" style="--d:19"><tspan fill="#3fb950">  ✓ 导出的逻辑都有测试 — 2 个运行时导出都有测试引用</tspan></text>
<text x="18" y="464" class="att-line" style="--d:20"><tspan fill="#3fb950">  ✓ 不过度抽象 — 2 个导出符号都有多个调用点</tspan></text>
<text x="18" y="484" class="att-line" style="--d:21"><tspan fill="#3fb950">  ✓ 没有重复造轮子 — 模块的导出符号在全仓都是独一份</tspan></text>
<text x="18" y="504" class="att-line" style="--d:22"><tspan fill="#8b949e">  · 使用主流开源库 — 模块没有第三方依赖 —— 确认这是有意的（简单</tspan></text>
<text x="18" y="524" class="att-line" style="--d:23">优先）</text>
<text x="18" y="544" class="att-line" style="--d:24"><tspan fill="#8b949e">      → 如果需求领域有成熟库，别自己写</tspan></text>
<text x="18" y="564" class="att-line" style="--d:25"><tspan fill="#3fb950">  ✓ 断言的期望值独立 — 扫了 1 个测试文件，没发现期望值取自被测对</tspan></text>
<text x="18" y="584" class="att-line" style="--d:26">象自身的断言</text>
<text x="18" y="604" class="att-line" style="--d:27"></text>
<text x="18" y="624" class="att-line" style="--d:28"><tspan fill="#39c5cf">── 未实测 ───────────────────────────────────────────</tspan></text>
<text x="18" y="644" class="att-line" style="--d:29"><tspan fill="#d29922">  — 测试能发现缺陷 — 未实测：加 --mutation-check 才会把源码改坏</tspan></text>
<text x="18" y="664" class="att-line" style="--d:30">再跑测试（要复制工作区并多次跑测试，很贵）</text>
<text x="18" y="684" class="att-line" style="--d:31"><tspan fill="#d29922">  — 表结构基本合规 — 没连上数据库（或模块不碰 PG）</tspan></text>
<text x="18" y="704" class="att-line" style="--d:32"><tspan fill="#d29922">  — 向量集合属性自洽 — 这个模块没有向量集合调用点（判不了）</tspan></text>
<text x="18" y="724" class="att-line" style="--d:33"><tspan fill="#d29922">  — 数据流一致（跨存储对账） — 模块只碰了 PG 一个存储 —— 没有派</tspan></text>
<text x="18" y="744" class="att-line" style="--d:34">生层要跨存储校对</text>
<text x="18" y="764" class="att-line" style="--d:35"><tspan fill="#d29922">  — 数据准确（基线对拍） — 本模块没有基线对拍脚本（仓库里别的包</tspan></text>
<text x="18" y="784" class="att-line" style="--d:36">的基线脚本不算数）</text>
<text x="18" y="804" class="att-line" style="--d:37"><tspan fill="#d29922">  — 需求覆盖到位 — 没给计划文件（--plan）</tspan></text>
<text x="18" y="824" class="att-line" style="--d:38"><tspan fill="#d29922">  — 计划与机器推导对齐 — 没给计划文件（--plan）</tspan></text>
<text x="18" y="844" class="att-line" style="--d:39"><tspan fill="#d29922">  — 应有判定点覆盖到位 — 没给计划文件（--plan）</tspan></text>
<text x="18" y="864" class="att-line" style="--d:40"><tspan fill="#d29922">  — 钉有区分力 — 没给计划文件（--plan）</tspan></text>
<text x="18" y="884" class="att-line" style="--d:41"><tspan fill="#d29922">  — 不变式有判定点 — 没给计划文件（--plan）</tspan></text>
<text x="18" y="904" class="att-line" style="--d:42"></text>
<text x="18" y="924" class="att-line" style="--d:43"><tspan fill="#39c5cf">── 本工具不判定 ────────────────────────────────</tspan></text>
<text x="18" y="944" class="att-line" style="--d:44"><tspan fill="#8b949e">  需求是否被正确理解 · 产品行为是否正确 · 性能 · 安全 · 可用性 ·</tspan></text>
<text x="18" y="964" class="att-line" style="--d:45"> 运维就绪 · 并发正确性 · 容量与规模行为</text>
<text x="18" y="984" class="att-line" style="--d:46"><tspan fill="#8b949e">  上面只是测试就绪度的实测结果；「能不能交付」仍要人判断。</tspan></text>
<text x="18" y="1004" class="att-line" style="--d:47"></text>
<text x="18" y="1024" class="att-line" style="--d:48"><tspan fill="#39c5cf">── 交付前置条件 ──────────────────────────────</tspan></text>
<text x="18" y="1044" class="att-line" style="--d:49"><tspan fill="#3fb950">  ✓ 证据没有阻塞项，关键判据也测到了</tspan></text>
<text x="18" y="1064" class="att-line" style="--d:50"><tspan fill="#f85149">  ✗ 没给计划文件 ⇒ 需求覆盖与确认无从谈起（--plan）</tspan></text>
<text x="18" y="1084" class="att-line" style="--d:51"><tspan fill="#8b949e">  ⇒ 前置条件不齐，还不能进交付流程</tspan></text>
<text x="18" y="1104" class="att-line" style="--d:52"></text>
<text x="18" y="1124" class="att-line" style="--d:53"><tspan fill="#c9d1d9"><tspan font-weight="700">结论：0 项阻塞 · 1 项待人工确认 · 11 项无信号 · 1 项实测通过（另</tspan></tspan></text>
<text x="18" y="1144" class="att-line" style="--d:54">有 6 条静态信号）</text>
<text x="18" y="1164" class="att-line" style="--d:55"><tspan fill="#c9d1d9"><tspan font-weight="700">退出码 1 = 有阻塞项，或关键判据（测试是否绿）没测到</tspan></tspan></text>
</g>
<rect x="18" y="1176" width="8" height="14" fill="#39c5cf" class="att-cursor"/>
<rect x="0" y="0" width="574" height="26" rx="6" fill="url(#att-band)" class="att-scan"/>
</svg>
