<text x="18" y="194"><tspan fill="#39c5cf">── 已实测 ───────────────────────────────────────────</tspan></text>
<text x="18" y="214"><tspan fill="#3fb950">  ✓ 测试全绿 — 没有失败用例</tspan></text>
<text x="18" y="234"><tspan fill="#d29922">  — 核心逻辑测试到位 — 仓库没有覆盖率闸门，缺少判据（实测平均行</tspan></text>
