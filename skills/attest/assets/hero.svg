<text x="18" y="314"></text>
<text x="18" y="334"><tspan fill="#39c5cf">── 静态信号（不能单独支撑「通过」） ────────────────────────────</tspan></text>
<text x="18" y="354"><tspan fill="#39c5cf">──</tspan></text>
<text x="18" y="374"><tspan fill="#3fb950">  ✓ 测试卫生（不留残留、不靠 sleep） — 没有固定等待，也没发现不</tspan></text>
<text x="18" y="394">清理的写库测试</text>
<text x="18" y="414"><tspan fill="#3fb950">  ✓ 导出的逻辑都有测试 — 2 个运行时导出都有测试引用</tspan></text>
<text x="18" y="434"><tspan fill="#3fb950">  ✓ 不过度抽象 — 2 个导出符号都有多个调用点</tspan></text>
<text x="18" y="454"><tspan fill="#3fb950">  ✓ 没有重复造轮子 — 模块的导出符号在全仓都是独一份</tspan></text>
<text x="18" y="474"><tspan fill="#8b949e">  · 使用主流开源库 — 模块没有第三方依赖 —— 确认这是有意的（简单</tspan></text>
<text x="18" y="494">优先）</text>
<text x="18" y="514"><tspan fill="#8b949e">      → 如果需求领域有成熟库，别自己写</tspan></text>
<text x="18" y="534"><tspan fill="#3fb950">  ✓ 断言的期望值独立 — 扫了 1 个测试文件，没发现期望值取自被测对</tspan></text>
<text x="18" y="554">象自身的断言</text>
