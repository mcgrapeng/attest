<text x="18" y="894"><tspan fill="#39c5cf">── 本工具不判定 ────────────────────────────────</tspan></text>
<text x="18" y="914"><tspan fill="#8b949e">  需求是否被正确理解 · 产品行为是否正确 · 性能 · 安全 · 可用性 ·</tspan></text>
